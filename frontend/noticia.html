function crearParrafos(texto) {
  return texto.split(/\n\n+/).map(parrafo => `<p>${parrafo}</p>`).join("");
}

function mostrarArticulo() {
  const id = new URLSearchParams(window.location.search).get("id");
  const articulo = articulos[id];
  const contenedor = document.getElementById("articulo");

  if (!articulo) {
    contenedor.innerHTML = `<div class="articulo-error"><h1>Artículo no encontrado</h1><p>El enlace puede estar incompleto o no corresponder a una noticia disponible.</p><a href="index.html">Volver a las noticias</a></div>`;
    return;
  }

  document.title = `${articulo.titulo} | Portal GTA VI`;
  contenedor.innerHTML = `
    <header class="articulo-cabecera">
      <span class="articulo-categoria">${articulo.categoria}</span>
      <h1 class="articulo-titulo">${articulo.titulo}</h1>
      <div class="articulo-meta">${articulo.fecha} · Portal GTA VI</div>
    </header>
    <img class="articulo-imagen" src="${articulo.imagen}" alt="${articulo.titulo}">
    <div class="articulo-cuerpo">
      ${articulo.secciones.map(([subtitulo, texto]) => `<section><h2>${subtitulo}</h2>${crearParrafos(texto)}</section>`).join("")}
    </div>
    <div class="articulo-nota">La información se basa en los materiales oficiales disponibles. Las interpretaciones y datos todavía no confirmados se presentan como tales.</div>
    <a class="articulo-volver" href="index.html">← Volver a las noticias</a>
  `;
}
mostrarArticulo();
