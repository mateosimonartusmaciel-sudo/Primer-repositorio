
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | GTA VI Noticias</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <img src="img/logo.webp" alt="GTA VI Noticias" class="login-logo">

            <p class="login-subtitle">PANEL PRIVADO</p>

            <h1>Administración</h1>

            <p class="login-description">
                Iniciá sesión para gestionar las noticias.
            </p>

            <form id="formularioLogin">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Tu correo electrónico"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        required
                    >
                </div>

                <p id="mensajeLogin" role="alert"></p>

                <button type="submit" id="btnLogin">
                    INICIAR SESIÓN
                </button>

            </form>

            <a href="index.html" class="volver-inicio">
                ← Volver a noticias
            </a>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
